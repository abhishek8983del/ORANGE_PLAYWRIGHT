name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]  
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # container:
    #   image: mcr.microsoft.com/playwright:v1.65.0-noble
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     shard: [1, 2, 3]

    env:
      WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
      API_AUTH_EMAIL: ${{ secrets.API_AUTH_EMAIL }}
      API_AUTH_PASSWORD: ${{ secrets.API_AUTH_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-v1
          restore-keys: |
                playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium


      - name: Run Playwright Tests
        # run: npx playwright test tests/web --shard=${{ matrix.shard }}/3
        if: github.event_name=='pull_request'
        # run: npx playwright test tests/web
        # run: npx playwright test tests/api
        run: npx playwright test
      
      - name: Upload HTML Report
        if: always() && github.event_name=='pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 5  

